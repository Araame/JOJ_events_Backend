[pytest]
DJANGO_SETTINGS_MODULE = joj_events.settings
python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*
# Activer le mode test Django
addopts = 
    --strict-markers
    --tb=short
    -q
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --html=reports/rapport_tests.html
    --self-contained-html

markers =
    unit: Tests unitaires (modèles, validators)
    api: Tests API (endpoints DRF)
    e2e: Tests end-to-end (Playwright)
    slow: Tests lents (à exclure du run rapide)